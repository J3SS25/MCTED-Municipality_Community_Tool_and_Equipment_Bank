<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4931"/>
      <stop offset="100%" stop-color="#0E281A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="95" fill="url(#sealGrad)" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#E5C158" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="100" cy="100" r="80" fill="#0C2317"/>
  
  <!-- Mount Iraya Silhouette / Sea Wave & Stone House -->
  <!-- Mt Iraya Mountain Shape -->
  <path d="M 40 130 Q 100 45 160 130 Z" fill="#2E6F48" opacity="0.8"/>
  <path d="M 65 130 Q 100 58 135 130 Z" fill="#3D8E5D"/>
  
  <!-- Sea Wave at bottom -->
  <path d="M 30 145 C 55 135, 75 155, 100 145 C 125 135, 145 155, 170 145 L 170 160 C 145 170, 125 150, 100 160 C 75 170, 55 150, 30 160 Z" fill="#2B7A78"/>

  <!-- Gear & Crossed Wrench/Spade Tool Bank Symbol -->
  <g transform="translate(100, 115) scale(0.65)">
    <!-- Gear -->
    <circle cx="0" cy="0" r="28" fill="#E5C158"/>
    <circle cx="0" cy="0" r="18" fill="#0C2317"/>
    <!-- Wrench -->
    <path d="M -30 -25 L -5 0 L 25 30 L 20 35 L -10 5 L -35 -20 Z" fill="#FFFFFF"/>
    <!-- Hammer / Trowel -->
    <path d="M 30 -25 L 5 0 L -25 30 L -20 35 L 10 5 L 35 -20 Z" fill="#E5C158"/>
  </g>

  <!-- Circular Text -->
  <path id="textArcTop" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <path id="textArcBottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  
  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#E5C158" letter-spacing="2">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      MUNICIPALITY OF BASCO
    </textPath>
  </text>
  
  <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#E5C158" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      TOOL &amp; EQUIPMENT BANK
    </textPath>
  </text>
  
  <!-- 3 Stars -->
  <circle cx="27" cy="100" r="2.5" fill="#E5C158"/>
  <circle cx="173" cy="100" r="2.5" fill="#E5C158"/>
  <polygon points="100,22 102,28 108,28 103,32 105,38 100,34 95,38 97,32 92,28 98,28" fill="#E5C158"/>
</svg>
