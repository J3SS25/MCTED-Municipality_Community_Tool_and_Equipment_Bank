<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#fffbeb" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#fde68a" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95)">
    <!-- Base Plate -->
    <rect x="-65" y="35" width="130" height="10" rx="3" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
    <!-- Blade Guard (Blue) -->
    <path d="M -40 35 A 48 48 0 0 1 48 20 L 40 35 Z" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>
    <!-- Saw Blade (Silver with Teeth) -->
    <circle cx="5" cy="20" r="42" fill="#cbd5e1" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="5" cy="20" r="10" fill="#0f172a"/>
    <!-- Motor Housing (Dark Blue) -->
    <rect x="-55" y="-15" width="45" height="40" rx="6" fill="#1e3a8a"/>
    <!-- Handle -->
    <path d="M -40 -15 C -40 -45, 10 -45, 10 -15" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <rect x="-10" y="-30" width="12" height="6" rx="2" fill="#ef4444"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">Bosch Professional Circular Saw</text>
</svg>
