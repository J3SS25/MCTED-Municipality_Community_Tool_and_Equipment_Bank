<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0f9ff" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 100)">
    <!-- Engine Cowling (Blue/Grey) -->
    <path d="M -30 -60 Q 20 -70 35 -50 Q 40 -30 25 -10 L -25 -10 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
    <text x="5" y="-35" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">15 HP</text>
    <!-- Midsection -->
    <rect x="-15" y="-10" width="25" height="45" fill="#334155"/>
    <rect x="-35" y="0" width="20" height="15" rx="3" fill="#64748b"/>
    <line x1="-35" y1="5" x2="-60" y2="5" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Lower Unit & Skeg -->
    <path d="M -15 35 L 15 35 L 20 60 L 5 70 L -15 35 Z" fill="#0284c7"/>
    <!-- Propeller -->
    <circle cx="20" cy="50" r="5" fill="#e2e8f0"/>
    <path d="M 20 50 L 32 38 M 20 50 L 32 62 M 20 50 L 8 50" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Yamaha 15HP Outboard Motor</text>
</svg>
