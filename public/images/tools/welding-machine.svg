<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95)">
    <!-- Main Box (Red/Black) -->
    <rect x="-60" y="-45" width="120" height="90" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <!-- Front Control Panel -->
    <rect x="-50" y="-35" width="40" height="70" rx="4" fill="#0f172a"/>
    <!-- Digital Amp Display (Green 200A) -->
    <rect x="-45" y="-28" width="30" height="14" rx="2" fill="#022c22"/>
    <text x="-30" y="-18" font-family="monospace" font-size="10" font-weight="bold" fill="#22c55e" text-anchor="middle">200</text>
    <!-- Knob -->
    <circle cx="-30" cy="5" r="8" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Terminals (+ / -) -->
    <circle cx="-40" cy="22" r="5" fill="#ef4444"/>
    <circle cx="-20" cy="22" r="5" fill="#3b82f6"/>
    <!-- Cooling Grille -->
    <line x1="5" y1="-25" x2="45" y2="-25" stroke="#991b1b" stroke-width="3"/>
    <line x1="5" y1="-15" x2="45" y2="-15" stroke="#991b1b" stroke-width="3"/>
    <line x1="5" y1="-5" x2="45" y2="-5" stroke="#991b1b" stroke-width="3"/>
    <line x1="5" y1="5" x2="45" y2="5" stroke="#991b1b" stroke-width="3"/>
    <!-- Top Handle Strap -->
    <path d="M -30 -45 C -30 -62, 30 -62, 30 -45" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">200A Inverter Arc / TIG Welder</text>
</svg>
