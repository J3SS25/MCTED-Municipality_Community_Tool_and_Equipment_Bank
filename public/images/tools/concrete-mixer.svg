<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95)">
    <!-- Frame / Stand -->
    <polygon points="-55,50 0,-10 55,50 40,50 0,5 -40,50" fill="#dc2626"/>
    <rect x="-65" y="45" width="130" height="6" fill="#334155"/>
    <!-- Wheels -->
    <circle cx="-50" cy="50" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <circle cx="50" cy="50" r="14" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
    <!-- Tipping Wheel -->
    <circle cx="-60" cy="-10" r="16" fill="none" stroke="#dc2626" stroke-width="3"/>
    <!-- Mixing Drum (Orange) -->
    <g transform="rotate(25)">
      <path d="M -35 -40 L 35 -40 L 45 10 L 0 35 L -45 10 Z" fill="#ea580c" stroke="#c2410c" stroke-width="2"/>
      <ellipse cx="0" cy="-40" rx="35" ry="8" fill="#475569"/>
      <ellipse cx="0" cy="-40" rx="28" ry="5" fill="#0f172a"/>
      <!-- Ring Gear -->
      <line x1="-43" y1="-10" x2="43" y2="-10" stroke="#334155" stroke-width="5" stroke-dasharray="4,2"/>
    </g>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Portable Electric Concrete Mixer (1-Bag)</text>
</svg>
