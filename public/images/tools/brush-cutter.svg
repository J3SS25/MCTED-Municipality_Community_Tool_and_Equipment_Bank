<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#f0fdf4" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95) rotate(-35)">
    <!-- Shaft -->
    <rect x="-100" y="-3" width="200" height="6" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
    <!-- Engine (Orange) -->
    <rect x="-130" y="-20" width="35" height="40" rx="6" fill="#ea580c"/>
    <circle cx="-110" cy="0" r="10" fill="#334155"/>
    <!-- Handlebars (Bullhorn) -->
    <path d="M -30 -3 L -30 -35 L -10 -40" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M -30 3 L -30 35 L -10 40" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Trimmer Head & Blade -->
    <circle cx="100" cy="0" r="14" fill="#334155"/>
    <path d="M 85 -25 L 115 25 L 115 -25 L 85 25 Z" fill="#e11d48"/>
    <!-- Guard -->
    <path d="M 75 -25 A 30 30 0 0 1 75 25 Z" fill="#ea580c"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Stihl High-Output Brush Cutter</text>
</svg>
