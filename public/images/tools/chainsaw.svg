<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#fef2f2" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95)">
    <!-- Guide Bar & Chain -->
    <path d="M -10 -5 L 85 -5 C 95 -5, 95 15, 85 15 L -10 15 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="80" cy="5" r="4" fill="#334155"/>
    <line x1="-5" y1="-5" x2="80" y2="-5" stroke="#334155" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="-5" y1="15" x2="80" y2="15" stroke="#334155" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Engine Body (Orange) -->
    <rect x="-65" y="-20" width="55" height="40" rx="8" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
    <!-- Hand Guard / Chain Brake (Black) -->
    <rect x="-20" y="-35" width="8" height="25" rx="2" fill="#1e293b"/>
    <!-- Top Handle -->
    <path d="M -50 -20 C -50 -40, -10 -40, -10 -20" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <!-- Rear Handle & Throttle -->
    <path d="M -65 -10 L -90 -10 L -90 10 L -65 15" fill="none" stroke="#ea580c" stroke-width="8" stroke-linejoin="round"/>
    <rect x="-85" y="-5" width="10" height="6" rx="2" fill="#1e293b"/>
    <!-- Pull Cord Grip -->
    <circle cx="-50" cy="0" r="10" fill="#334155"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Stihl MS382 Heavy Rescue Chainsaw</text>
</svg>
