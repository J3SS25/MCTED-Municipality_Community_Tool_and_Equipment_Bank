<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <rect width="300" height="200" fill="#fef2f2" rx="8"/>
  <rect x="10" y="10" width="280" height="180" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" rx="6"/>
  <g transform="translate(150, 95)">
    <!-- Generator Canopy (Yellow/Black) -->
    <rect x="-65" y="-45" width="130" height="85" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <!-- Top Access Hatch -->
    <rect x="-45" y="-45" width="90" height="10" fill="#ca8a04"/>
    <!-- Control Panel -->
    <rect x="-55" y="-25" width="45" height="55" rx="4" fill="#0f172a"/>
    <!-- Gauges & Breakers -->
    <circle cx="-42" cy="-12" r="7" fill="#ffffff"/>
    <line x1="-42" y1="-12" x2="-40" y2="-16" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="-25" cy="-12" r="4" fill="#22c55e"/>
    <rect x="-48" y="5" width="10" height="15" rx="2" fill="#3b82f6"/>
    <rect x="-32" y="5" width="10" height="15" rx="2" fill="#3b82f6"/>
    <!-- Side Air Vents -->
    <rect x="5" y="-25" width="50" height="55" rx="3" fill="#334155"/>
    <line x1="12" y1="-15" x2="48" y2="-15" stroke="#94a3b8" stroke-width="2"/>
    <line x1="12" y1="-5" x2="48" y2="-5" stroke="#94a3b8" stroke-width="2"/>
    <line x1="12" y1="5" x2="48" y2="5" stroke="#94a3b8" stroke-width="2"/>
    <line x1="12" y1="15" x2="48" y2="15" stroke="#94a3b8" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="-45" cy="42" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <circle cx="45" cy="42" r="10" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">5.5kVA Silent Diesel Generator</text>
</svg>
